steps:
  - name: node:22-bookworm-slim
    entrypoint: bash
    args: ["-euo", "pipefail", "-c", "npm ci && npm run check && npm test && npm run build && npm audit"]
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest || true
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--cache-from", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$COMMIT_SHA", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$COMMIT_SHA"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest"]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest

serviceAccount: projects/$PROJECT_ID/serviceAccounts/ls-${_ENVIRONMENT}-release@$PROJECT_ID.iam.gserviceaccount.com

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _ENVIRONMENT: staging
  _REGION: us-central1
  _REPOSITORY: lesson-studio

timeout: 1800s
