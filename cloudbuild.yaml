steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull us-central1-docker.pkg.dev/$PROJECT_ID/lesson-studio/app:latest || true
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--cache-from", "us-central1-docker.pkg.dev/$PROJECT_ID/lesson-studio/app:latest", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/lesson-studio/app:latest", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/lesson-studio/app:latest"]

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/lesson-studio/app:latest

options:
  machineType: E2_HIGHCPU_8

timeout: 1800s
